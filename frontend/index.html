<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      파비콘을 둘로 둔다 — png(32x32) 와 ico.

      **`/favicon.ico` 는 파일이 반드시 존재해야 한다.** 없으면 SPA 폴백이 걸려 `index.html` 을
      `text/html` 로 돌려주는데, 브라우저는 이 경로를 링크 태그와 무관하게 암묵적으로 한 번
      찾아보고 HTML 을 받으면 "아이콘 없음"으로 캐시한다 — 그 캐시가 링크 태그보다 오래 남아
      탭에 기본 아이콘이 박힌다(실제로 겪었다).

      **SVG 줄은 뺐다.** 예전에는 `favicon.svg` 를 첫 줄에 뒀는데, 지금 쓰는 아이콘 묶음에는
      svg 가 없다. 링크만 남기면 svg 를 우선하는 브라우저가 **옛 아이콘을 계속 보여준다** —
      아이콘을 갈았는데 안 바뀌는 것처럼 보이는 가장 흔한 원인이다.

      새 ico 는 16x16 한 장뿐이라 고해상도 탭에서 뭉갠다. png(32x32) 를 함께 두는 이유가
      그것이다 — png 를 읽는 브라우저는 그쪽을 쓰고, ico 는 폴백으로 남는다.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      본문 글꼴은 Pretendard 하나다.

      예전엔 Noto Sans KR(4 weight)까지 함께 받았는데, `--font-sans` 가
      `'Pretendard', 'Noto Sans KR', sans-serif` 라 **Pretendard 가 뜨는 순간 Noto 는 절대
      쓰이지 않는다.** 한글 글꼴은 한 벌만 해도 수백 KB라, 쓰지도 않을 두 번째 벌을 받느라
      첫 화면이 늦어졌다. 출처(origin)도 하나 줄었다.

      static 대신 **dynamic-subset** 을 쓴다. 정적 배포본은 한글 전 범위를 통째로 받지만,
      dynamic-subset 은 unicode-range 로 잘게 나뉘어 **화면에 실제로 나온 글자의 조각만**
      받는다. 초등 교실 화면처럼 글자 수가 한정된 곳에서 차이가 특히 크다.
    -->
    <!--
      **이 스타일시트는 렌더를 막지 않는다.**

      그냥 `rel="stylesheet"` 로 두면 브라우저는 이 CSS(60KB, @font-face 92개)를 받아 파싱할
      때까지 **첫 그림을 그리지 않는다.** 게다가 우리 오리진이 아니라 jsdelivr 이라 연결
      수립까지 기다려야 했다(preconnect 로 줄이긴 하지만 없애지는 못한다).

      그래서 두 줄로 나눈다:
       - `preload as="style"` — 우선순위를 높여 **빨리** 받아 온다 (아래 링크와 같은 URL·같은
         crossorigin 이라 요청은 하나로 합쳐진다).
       - `media="print"` + `onload` — 받는 동안에는 화면용이 아니므로 렌더를 막지 않고,
         다 받은 순간 `all` 로 바꿔 적용한다.

      글자가 안 보이는 구간은 생기지 않는다 — Pretendard CSS 자체가 `font-display: swap` 이라
      웹폰트가 오기 전에는 어차피 시스템 글꼴로 먼저 그려진다. 이 변경은 그 교체 시점을
      "CSS 를 다 받은 뒤"에서 "첫 그림 뒤"로 옮길 뿐이다.

      JS 가 꺼진 환경에서는 `onload` 가 돌지 않으므로 noscript 로 원래 방식을 남겨 둔다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="preload"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link
      rel="stylesheet"
      crossorigin
      media="print"
      onload="this.media='all'"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <noscript>
      <link
        rel="stylesheet"
        crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
      />
    </noscript>
    <!--
      첫 그림에만 쓰이는 제목. 앱이 뜨면 라우트가 화면에 맞는 제목으로 바꾼다
      (app/routes/DocumentTitle.tsx). 여기에 화면 이름을 적어 두면 어느 화면으로 들어와도
      그 이름이 잠깐 스쳐 지나가므로, 서비스 이름만 둔다.
    -->
    <title>말랑교실</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
