# 테스트 전용 설정. 클래스패스에서 main 의 application.yml 을 가린다(같은 이름 = 첫 번째만 로드).
# 목표: 외부 인프라(Postgres/Redis/LiveKit) 없이도 컨텍스트가 뜨고 슬라이스 테스트가 돌아갈 것.
spring:
  application:
    name: mallang
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    # 인메모리 H2 — 테이블은 만들지 않는다. 여기서 검증하는 건 "빈 배선"이지 스키마가 아니다
    # (스키마 검증은 실제 Postgres 를 붙이는 통합 테스트/CI 의 몫).
    url: jdbc:h2:mem:mallang-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    # none: Postgres 전용 타입(jsonb)이 H2 DDL 로 새어 나가지 않게 한다
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    # 마이그레이션은 Postgres 방언 — H2 에서 돌리지 않는다
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: mallang-test-secret-key-for-unit-tests-32bytes!
  access-token-validity: PT30M
  refresh-token-validity: P14D

mallang:
  media:
    root: ${java.io.tmpdir}/mallang-media-test
  app:
    base-url: http://localhost:5173
  password-reset:
    token-validity: PT30M

# spring.mail.host 를 두지 않는다 — JavaMailSender 빈이 만들어지지 않고
# PasswordResetMailSender 가 발송을 건너뛴다. 테스트가 메일 서버를 찾지 않게 하려는 것이다.

livekit:
  public-url: wss://livekit.test:7880
  api-key: test-api-key
  api-secret: test-api-secret-must-be-at-least-32-bytes-long
  token-validity: PT5M

logging:
  level:
    org.hibernate.SQL: warn
