# 로컬 개발용: PostgreSQL + Redis
# 사용법: docker compose -f docker-compose.local.yml up -d
# (Docker Desktop 필요. 없으면 EC2에 SSH 터널로 접속하는 방법도 있음 — README 참고)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mallang-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: mallang
      POSTGRES_USER: mallang
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mallang-redis-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-local-data:
