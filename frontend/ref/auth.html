<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말랑교실 — 선생님 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --primary:#6276D9;       --primary-hover:#5568CC;
  --sky:#DCEBFA;
  --mint-deep:#0F7A63;
  --red:#E14B3B;           --red-soft:#FDEAE7;

  --bg:#FBFBFB;
  --card:#FFFFFF;
  --ink:#2E3137;
  --ink-soft:#6F7683;
  --ink-mute:#A7ADB8;
  --track:#ECECEC;

  --r-lg:28px;
  --shadow:0 8px 24px rgba(0,0,0,.07);
  --shadow-lg:0 20px 48px rgba(0,0,0,.10);
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --font:'Pretendard','Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:#F0F5FD;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px;overflow-y:auto;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{
  outline:3px solid var(--primary);outline-offset:2px;border-radius:12px
}

/* ============ 바깥 상자 (헤더 공간 + 이미지 무대, 웹 풀사이즈) ============ */
.auth-shell{
  width:calc(100vw - 64px);height:calc(100vh - 64px);
  max-width:1760px;max-height:1000px;
  border-radius:36px;box-shadow:var(--shadow-lg);overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  background-image:url('assets/login-bg.png');
  background-size:cover;background-position:left 70%;background-repeat:no-repeat;
}
.auth-shell.is-signup{
  background-image:url('assets/regi-bg.png');
  background-position:left 100%;
}

/* ============ 상단 헤더 공간 (이미지 위 오버레이, 서비스 소개) ============ */
.shell-top{
  flex:none;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:28px 40px;
}
.shell-brand{display:flex;align-items:center;gap:12px}
.shell-brand .brand-logo{
  width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);
  display:grid;place-items:center;font-size:1.5rem;flex:none;
}
.shell-brand .brand-name{font-size:1.2rem;font-weight:900;letter-spacing:-.3px}
.shell-brand .brand-sub{margin-top:1px;font-size:.8rem;color:var(--ink-soft);font-weight:600}

/* ============ 이미지 무대 (셸 배경 이미지 위에 로그인 카드만 얹힘) ============ */
.auth-stage{
  position:absolute;inset:0;
}
.stage-headline{
  position:absolute;top:36px;left:44px;max-width:360px;z-index:1;
  font-size:1.7rem;font-weight:900;line-height:1.4;letter-spacing:-.4px;color:var(--ink);
}
.stage-headline b{color:var(--primary)}

.login-float{
  position:absolute;top:50%;right:7%;transform:translateY(-50%);
  width:min(460px,86vw);background:var(--card);border-radius:28px;box-shadow:var(--shadow-lg);
  padding:32px 44px 28px;
  overflow-y:auto;
}
.auth-panel{display:none;animation:fadeUp .35s var(--bounce)}
.auth-panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.auth-panel h2{font-size:2.1rem;font-weight:900;text-align:center;margin-bottom:10px}
.login-sub{text-align:center;font-size:1.5rem;font-weight:700;color:var(--ink-soft);line-height:1.5;margin-bottom:26px}
.login-sub b{color:var(--primary)}
.login-spacer{height:260px}

.field{margin-bottom:26px}
.field label{display:block;font-size:.95rem;font-weight:800;margin-bottom:11px}
.field-input-wrap{position:relative}
.field input{
  width:100%;background:var(--bg);border:2px solid var(--bg);border-radius:16px;
  padding:18px 20px;font-size:1rem;font-weight:600;color:var(--ink);
  transition:border-color .18s;
}
.field-input-wrap input{padding-right:44px}
.field input:focus{border-color:var(--primary);outline:none}
.field-error{margin-top:6px;font-size:.76rem;color:var(--red);font-weight:700;display:none}
.field.invalid input{border-color:var(--red);background:var(--red-soft)}
.field.invalid .field-error{display:block}
.pw-toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-mute);
  transition:background .18s,color .18s;
}
.pw-toggle:hover{background:var(--sky);color:var(--primary)}
.pw-toggle svg{width:18px;height:18px}

.row-between{display:flex;align-items:center;justify-content:space-between;margin:-8px 0 26px;flex-wrap:wrap;gap:8px}
.check-row{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--ink-soft);font-weight:600}
.check-row input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.link-btn{font-size:.82rem;color:var(--ink-soft);font-weight:700}
.link-btn:hover{color:var(--primary)}

.auth-submit{
  width:100%;font-weight:900;font-size:1.05rem;color:#fff;
  background:var(--primary);border-radius:999px;padding:19px;
  box-shadow:0 10px 22px rgba(98,118,217,.32);
  transition:transform .18s var(--bounce),background .18s;
}
.auth-submit:hover{background:var(--primary-hover);transform:translateY(-2px)}
.auth-submit:active{transform:scale(1.02)}

.or-divider{display:flex;align-items:center;gap:12px;margin:26px 0 18px;color:var(--ink-mute);font-size:.8rem;font-weight:700}
.or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--track)}

.social-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  border:2px solid var(--track);border-radius:16px;padding:16px;margin-top:13px;
  font-size:.94rem;font-weight:700;color:var(--ink);background:#fff;
  transition:transform .18s var(--bounce),border-color .18s,background .18s;
}
.social-btn:hover{transform:translateY(-2px);background:var(--bg);border-color:#D9DEE8}
.social-btn svg{width:20px;height:20px;flex:none}

.auth-foot{margin-top:24px;text-align:center;font-size:.85rem;color:var(--ink-soft);font-weight:600}
.auth-foot button{color:var(--primary);font-weight:900}
.auth-foot button:hover{text-decoration:underline}

.role-note{
  display:flex;align-items:flex-start;gap:9px;background:var(--sky);color:var(--primary-hover);
  border-radius:14px;padding:11px 14px;font-size:.76rem;font-weight:700;line-height:1.5;margin-bottom:16px;
}
.role-note svg{width:15px;height:15px;flex:none;margin-top:2px}

.toast{
  position:fixed;left:50%;top:24px;translate:-50% -160%;z-index:70;
  background:var(--ink);color:#fff;font-weight:700;font-size:.9rem;
  border-radius:999px;padding:13px 26px;box-shadow:0 10px 30px rgba(0,0,0,.25);
  transition:translate .45s var(--bounce);white-space:nowrap;
}
.toast.show{translate:-50% 0}

@media (max-width:860px){
  .auth-shell{width:calc(100vw - 32px);height:auto;border-radius:28px;background-position:center bottom}
  .shell-top{padding:20px}
  .auth-stage{min-height:260px}
  .stage-headline{position:static;padding:170px 20px 20px;font-size:1.25rem;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .stage-headline b{color:#fff}
  .login-float{position:static;transform:none;width:calc(100% - 40px);margin:0 20px 24px;box-shadow:none;border:1px solid var(--track)}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="ic-alert" d="M12 2 1 21h22L12 2Zm0 6a1.2 1.2 0 0 1 1.2 1.2v4.6a1.2 1.2 0 1 1-2.4 0V9.2A1.2 1.2 0 0 1 12 8Zm0 9.4a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/>
    <path id="ic-eye" d="M12 5c5.5 0 9.4 4.8 10.7 6.6a1 1 0 0 1 0 1.2C21.4 14.6 17.5 19.4 12 19.4S2.6 14.6 1.3 12.8a1 1 0 0 1 0-1.2C2.6 9.8 6.5 5 12 5Zm0 2.6a4.4 4.4 0 1 0 0 8.8 4.4 4.4 0 0 0 0-8.8Zm0 2.2a2.2 2.2 0 1 1 0 4.4 2.2 2.2 0 0 1 0-4.4Z"/>
    <path id="ic-eye-off" d="M3.2 2.8a1 1 0 0 1 1.4 0l16.6 16.6a1 1 0 0 1-1.4 1.4l-2.3-2.3c-1.6.9-3.4 1.5-5.5 1.5-5.5 0-9.4-4.8-10.7-6.6a1 1 0 0 1 0-1.2 20 20 0 0 1 4-4.2L3.2 4.2a1 1 0 0 1 0-1.4Zm5.2 5.2 1.6 1.6a2.2 2.2 0 0 0 3 3l1.6 1.6a4.4 4.4 0 0 1-6.2-6.2ZM12 5c5.5 0 9.4 4.8 10.7 6.6a1 1 0 0 1 0 1.2 19 19 0 0 1-2.9 3.2l-1.5-1.5a4.4 4.4 0 0 0-5.8-5.8L10.8 6.9c.4-.1.8-.1 1.2-.1Z"/>
    <path id="ic-spark" d="M12 2a1 1 0 0 1 1 .8l1 4.5 4.5 1a1 1 0 0 1 0 2l-4.5 1-1 4.5a1 1 0 0 1-2 0l-1-4.5-4.5-1a1 1 0 0 1 0-2l4.5-1 1-4.5A1 1 0 0 1 12 2Zm7 12a.8.8 0 0 1 .8.6l.4 1.7 1.7.4a.8.8 0 0 1 0 1.6l-1.7.4-.4 1.7a.8.8 0 0 1-1.6 0l-.4-1.7-1.7-.4a.8.8 0 0 1 0-1.6l1.7-.4.4-1.7A.8.8 0 0 1 19 14Z"/>
  </defs>
</svg>

<div class="auth-shell">
  <div class="shell-top">
    <div class="shell-brand">
      <span class="brand-logo" aria-hidden="true">🌱</span>
      <div>
        <div class="brand-name">말랑교실</div>
        <div class="brand-sub">복식학급 통합 수업 관리</div>
      </div>
    </div>
  </div>

  <div class="auth-stage">
    <div class="login-float">
      <!-- ============ 로그인 ============ -->
      <div class="auth-panel active" id="panelLogin">
        <h2>로그인</h2>
        <p class="login-sub">선생님의 즐거운 수업을 <b>말랑교실</b>이 함께해요!</p>
        <form id="loginForm" novalidate>
          <div class="field" id="f-login-email">
            <label for="li-email">이메일 주소</label>
            <input type="email" id="li-email" placeholder="이메일을 입력해주세요" autocomplete="email">
            <p class="field-error">이메일을 입력해 주세요.</p>
          </div>
          <div class="field" id="f-login-pw">
            <label for="li-pw">비밀번호</label>
            <div class="field-input-wrap">
              <input type="password" id="li-pw" placeholder="비밀번호를 입력해주세요" autocomplete="current-password">
              <button type="button" class="pw-toggle" id="toggleLiPw" aria-label="비밀번호 표시">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use id="toggleLiPwIcon" href="#ic-eye-off" fill="currentColor"/></svg>
              </button>
            </div>
            <p class="field-error">비밀번호를 입력해 주세요.</p>
          </div>
          <div class="row-between">
            <label class="check-row"><input type="checkbox" id="keepLogin">로그인 상태 유지</label>
            <button type="button" class="link-btn" id="forgotPwBtn">비밀번호 찾기</button>
          </div>
          <button type="submit" class="auth-submit">로그인</button>
        </form>

        <div class="login-spacer" aria-hidden="true"></div>
        <p class="auth-foot">아직 계정이 없으신가요? <button type="button" id="goSignupBtn2">회원가입</button></p>
      </div>

      <!-- ============ 회원가입 ============ -->
      <div class="auth-panel" id="panelSignup">
        <h2>회원가입</h2>
        <div class="role-note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-alert" fill="currentColor"/></svg>
          선생님 전용 가입 화면이에요. 학생은 선생님이 보내주는 학급 참여 코드로 가입할 수 있어요.
        </div>
        <form id="signupForm" novalidate>
          <div class="field" id="f-su-name">
            <label for="su-name">이름</label>
            <input type="text" id="su-name" placeholder="예: 김하늘" autocomplete="name">
            <p class="field-error">이름을 입력해 주세요.</p>
          </div>
          <div class="field" id="f-su-school">
            <label for="su-school">재직 학교</label>
            <input type="text" id="su-school" placeholder="예: 은솔초등학교" autocomplete="organization">
            <p class="field-error">재직 학교를 입력해 주세요.</p>
          </div>
          <div class="field" id="f-su-email">
            <label for="su-email">이메일</label>
            <input type="email" id="su-email" placeholder="이메일을 입력해주세요" autocomplete="email">
            <p class="field-error">올바른 이메일을 입력해 주세요.</p>
          </div>
          <div class="field" id="f-su-pw">
            <label for="su-pw">비밀번호</label>
            <div class="field-input-wrap">
              <input type="password" id="su-pw" placeholder="8자 이상 입력하세요" autocomplete="new-password">
              <button type="button" class="pw-toggle" id="toggleSuPw" aria-label="비밀번호 표시">
                <svg viewBox="0 0 24 24" aria-hidden="true"><use id="toggleSuPwIcon" href="#ic-eye-off" fill="currentColor"/></svg>
              </button>
            </div>
            <p class="field-error">비밀번호는 8자 이상이어야 해요.</p>
          </div>
          <button type="submit" class="auth-submit">회원가입</button>
        </form>
        <p class="auth-foot">이미 계정이 있으신가요? <button type="button" id="goLoginBtn">로그인</button></p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

function lockLoginFloatHeight(){
  const floatEl = document.querySelector(".login-float");
  const h = $("panelLogin").offsetHeight;
  floatEl.style.height = (h + 32 + 28) + "px";
}
window.addEventListener("load", lockLoginFloatHeight);

function switchTab(tab){
  const isLogin = tab === "login";
  $("panelLogin").classList.toggle("active", isLogin);
  $("panelSignup").classList.toggle("active", !isLogin);
  document.querySelector(".auth-shell").classList.toggle("is-signup", !isLogin);
}
$("goSignupBtn2").addEventListener("click", () => switchTab("signup"));
$("goLoginBtn").addEventListener("click", () => switchTab("login"));

function setInvalid(fieldId, invalid){
  $(fieldId).classList.toggle("invalid", invalid);
}

function wirePwToggle(inputId, btnId, iconId){
  $(btnId).addEventListener("click", () => {
    const input = $(inputId);
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    $(iconId).setAttribute("href", showing ? "#ic-eye-off" : "#ic-eye");
  });
}
wirePwToggle("li-pw", "toggleLiPw", "toggleLiPwIcon");
wirePwToggle("su-pw", "toggleSuPw", "toggleSuPwIcon");

let toastTimer = null;
function showToast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

$("loginForm").addEventListener("submit", (e) => {
  e.preventDefault();
  /* 지금은 데모 단계라 입력값 검증 없이 바로 입장 */
  window.location.href = "teacher.html";
});

$("signupForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("su-name").value.trim();
  const school = $("su-school").value.trim();
  const email = $("su-email").value.trim();
  const pw = $("su-pw").value;
  const emailValid = /\S+@\S+\.\S+/.test(email);

  setInvalid("f-su-name", name.length === 0);
  setInvalid("f-su-school", school.length === 0);
  setInvalid("f-su-email", !emailValid);
  setInvalid("f-su-pw", pw.length < 8);

  if (!name || !school || !emailValid || pw.length < 8) return;
  showToast(`${name} 선생님, 가입이 완료됐어요`);
  setTimeout(() => { window.location.href = "teacher.html"; }, 700);
});

$("forgotPwBtn").addEventListener("click", () => {
  showToast("비밀번호 재설정 메일 안내는 준비 중이에요");
});
</script>
</body>
</html>
